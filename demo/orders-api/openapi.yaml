openapi: 3.0.3
info:
  title: Orders API
  version: 1.0.0
paths:
  /orders:
    post:
      summary: Create an order
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                items:
                  type: array
                  minItems: 1
                  items:
                    $ref: '#/components/schemas/LineItem'
      responses:
        '201':
          description: The created order with its total
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          description: Invalid line items
  /orders/{id}:
    get:
      summary: Get an order
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The order
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '404':
          description: Order not found
components:
  schemas:
    LineItem:
      type: object
      required: [sku, unitPrice, quantity]
      properties:
        sku:
          type: string
        unitPrice:
          type: number
          minimum: 0
        quantity:
          type: integer
          minimum: 1
    Order:
      type: object
      required: [id, items, total, createdAt]
      properties:
        id:
          type: string
        items:
          type: array
          items:
            $ref: '#/components/schemas/LineItem'
        total:
          type: number
          description: Subtotal minus the discount (see docs/SPEC.md#Pricing)
        createdAt:
          type: string
          format: date-time
